              opdata: 'Used: {ITEM.LASTVALUE1}'
              priority: WARNING
              dependencies:
                - name: 'Yeastar: Local storage critically full'
                  expression: 'min(/Yeastar P-Series by SNMP/yeastar.storage.util,5m)>{$YEASTAR.STORAGE.UTIL.CRIT}'
              tags:
                - tag: scope
                  value: capacity
        - uuid: da5979450ff9443ead24148ef204e39d
