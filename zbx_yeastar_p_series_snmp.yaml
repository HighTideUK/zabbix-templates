      discovery_rules:
        - uuid: 049800337ddf4db1a85cb8e266aca63b
          name: 'Extension discovery'
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#EXT_NUM},1.3.6.1.4.1.22736.3.4.2.1.2,{#EXT_NAME},1.3.6.1.4.1.22736.3.4.2.1.3]'
          key: yeastar.ext.discovery
          delay: 1h
          lifetime: 7d
          filter:
            evaltype: AND
            conditions:
              - macro: '{#EXT_NUM}'
                value: '{$YEASTAR.EXT.NUM.MATCHES}'
                formulaid: A
              - macro: '{#EXT_NUM}'
                value: '{$YEASTAR.EXT.NUM.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
                formulaid: B
          item_prototypes:
            - uuid: 8d42e547cfaa4947a5432dc63c205407
              name: 'Extension {#EXT_NUM} ({#EXT_NAME}): Status'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.22736.3.4.2.1.4.{#SNMPINDEX}'
              key: 'yeastar.ext.status[{#EXT_NUM}]'
              delay: 2m
              history: 7d
              trends: '0'
              value_type: CHAR
              tags:
                - tag: component
                  value: extension
                - tag: extension
                  value: '{#EXT_NUM}'
              trigger_prototypes:
                - uuid: 25f7acfef4384110bae1cc331ecea549
                  expression: '{$YEASTAR.EXT.ALERT:"{#EXT_NUM}"}=1 and last(/Yeastar P-Series by SNMP/yeastar.ext.status[{#EXT_NUM}])="offline" and count(/Yeastar P-Series by SNMP/yeastar.ext.status[{#EXT_NUM}],{$YEASTAR.EXT.OFFLINE.PERIOD},"ne","offline")=0'
                  recovery_mode: RECOVERY_EXPRESSION
                  recovery_expression: 'last(/Yeastar P-Series by SNMP/yeastar.ext.status[{#EXT_NUM}])<>"offline"'
                  name: 'Yeastar: Extension {#EXT_NUM} ({#EXT_NAME}) is offline'
                  priority: AVERAGE
                  description: 'Only fires for extensions with {$YEASTAR.EXT.ALERT:"<ext>"}=1 (e.g. lift, door, refuge or reception phones).'
                  dependencies:
                    - name: 'Yeastar: No SNMP data from PBX'
                      expression: 'nodata(/Yeastar P-Series by SNMP/yeastar.calls.concurrent,{$YEASTAR.NODATA.TIMEOUT})=1'
                  tags:
                    - tag: scope
                      value: availability
        - uuid: 418b80c1988d48a2b0de325ea9e38df6
          name: 'Trunk discovery'
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#TRUNK_NAME},1.3.6.1.4.1.22736.3.4.4.1.2,{#TRUNK_TYPE},1.3.6.1.4.1.22736.3.4.4.1.3]'
          key: yeastar.trunk.discovery
          delay: 1h
          lifetime: 7d
          filter:
            evaltype: AND
            conditions:
              - macro: '{#TRUNK_NAME}'
                value: '{$YEASTAR.TRUNK.NAME.MATCHES}'
                formulaid: A
              - macro: '{#TRUNK_NAME}'
                value: '{$YEASTAR.TRUNK.NAME.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
                formulaid: B
          item_prototypes:
            - uuid: 46623a276f3c42eb9159a05040bf6aa5
              name: 'Trunk {#TRUNK_NAME} ({#TRUNK_TYPE}): Status'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.22736.3.4.4.1.4.{#SNMPINDEX}'
              key: 'yeastar.trunk.status[{#SNMPINDEX}]'
              delay: 1m
              history: 30d
              trends: '0'
              value_type: CHAR
              tags:
                - tag: component
                  value: trunk
                - tag: trunk
                  value: '{#TRUNK_NAME}'
              trigger_prototypes:
                - uuid: ad4864030ecf4fe5926af4c1bd5c4949
                  expression: '{$YEASTAR.TRUNK.ALERT:"{#TRUNK_NAME}"}=1 and find(/Yeastar P-Series by SNMP/yeastar.trunk.status[{#SNMPINDEX}],,"regexp","{$YEASTAR.TRUNK.STATUS.OK}")=0 and count(/Yeastar P-Series by SNMP/yeastar.trunk.status[{#SNMPINDEX}],{$YEASTAR.TRUNK.DOWN.PERIOD},"regexp","{$YEASTAR.TRUNK.STATUS.OK}")=0'
                  recovery_mode: RECOVERY_EXPRESSION
                  recovery_expression: 'find(/Yeastar P-Series by SNMP/yeastar.trunk.status[{#SNMPINDEX}],,"regexp","{$YEASTAR.TRUNK.STATUS.OK}")=1'
                  name: 'Yeastar: Trunk {#TRUNK_NAME} is down'
                  opdata: 'Status: {ITEM.LASTVALUE1}'
                  priority: HIGH
                  dependencies:
                    - name: 'Yeastar: No SNMP data from PBX'
                      expression: 'nodata(/Yeastar P-Series by SNMP/yeastar.calls.concurrent,{$YEASTAR.NODATA.TIMEOUT})=1'
                  tags:
                    - tag: scope
                      value: availability
      tags:
        - tag: class
          value: telephony
        - tag: target
          value: yeastar
      macros:
        - macro: '{$YEASTAR.CALLS.MAX}'
          value: '30'
          description: 'Licensed max concurrent calls for this PBX. Set per host.'
        - macro: '{$YEASTAR.CALLS.WARN.PCT}'
          value: '90'
          description: 'Warn when concurrent calls reach this % of {$YEASTAR.CALLS.MAX}.'
        - macro: '{$YEASTAR.CPU.UTIL.CRIT}'
          value: '85'
        - macro: '{$YEASTAR.MEMORY.UTIL.MAX}'
          value: '90'
        - macro: '{$YEASTAR.STORAGE.UTIL.WARN}'
          value: '85'
        - macro: '{$YEASTAR.STORAGE.UTIL.CRIT}'
          value: '95'
        - macro: '{$YEASTAR.NODATA.TIMEOUT}'
          value: 5m
        - macro: '{$YEASTAR.WAN.MONITOR}'
          value: '0'
          description: 'Set to 1 if the PBX WAN port is in use.'
        - macro: '{$YEASTAR.EXT.ALERT}'
          value: '0'
          description: 'Default for extension offline alerting. Enable per extension with context, e.g. {$YEASTAR.EXT.ALERT:"2001"}=1.'
        - macro: '{$YEASTAR.EXT.OFFLINE.PERIOD}'
          value: 10m
          description: 'Extension must be continuously offline this long before alerting.'
        - macro: '{$YEASTAR.EXT.NUM.MATCHES}'
          value: '.*'
        - macro: '{$YEASTAR.EXT.NUM.NOT_MATCHES}'
          value: CHANGE_IF_NEEDED
        - macro: '{$YEASTAR.TRUNK.ALERT}'
          value: '1'
          description: 'Default for trunk alerting. Disable per trunk with context, e.g. {$YEASTAR.TRUNK.ALERT:"Backup SIP"}=0.'
        - macro: '{$YEASTAR.TRUNK.STATUS.OK}'
          value: '^(online|registered|ok)$'
          description: 'Regex of trunk status values treated as healthy. Adjust after walking 1.3.6.1.4.1.22736.3.4.4.1.4.'
        - macro: '{$YEASTAR.TRUNK.DOWN.PERIOD}'
          value: 3m
          description: 'Trunk must be unhealthy for this long before alerting.'
        - macro: '{$YEASTAR.TRUNK.NAME.MATCHES}'
          value: '.*'
        - macro: '{$YEASTAR.TRUNK.NAME.NOT_MATCHES}'
          value: CHANGE_IF_NEEDED
