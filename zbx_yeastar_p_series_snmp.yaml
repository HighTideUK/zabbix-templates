                  value: capacity
        - uuid: 5184da1c6b1b4b589f629476d9a22ce3
          name: 'Yeastar: Trap - trunk max concurrent calls'
          type: SNMP_TRAP
          key: 'snmptrap["pTrunkMaxCCTraps"]'
          delay: '0'
          history: 30d
