          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.22736.3.1.3.0
          key: yeastar.firmware
          delay: 1h
          history: 90d
          trends: '0'
          value_type: CHAR
          inventory_link: OS
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          tags:
            - tag: component
              value: system
          triggers:
            - uuid: 91f4428033d04997b1d88ed4e03984f6
              expression: 'last(/Yeastar P-Series by SNMP/yeastar.firmware,#1)<>last(/Yeastar P-Series by SNMP/yeastar.firmware,#2) and length(last(/Yeastar P-Series by SNMP/yeastar.firmware))>0'
              name: 'Yeastar: Firmware version has changed'
              opdata: 'Current: {ITEM.LASTVALUE1}'
              priority: INFO
              manual_close: 'YES'
              tags:
                - tag: scope
                  value: notice
        - uuid: cfccaf3882354124b10ea64682c19b9d
          name: 'Yeastar: Serial number'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.22736.3.1.4.0
