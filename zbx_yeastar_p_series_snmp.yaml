          triggers:
            - uuid: b427cec43fec44708f157d628a36eaa4
              expression: 'nodata(/Yeastar P-Series by SNMP/yeastar.calls.concurrent,{$YEASTAR.NODATA.TIMEOUT})=1'
              name: 'Yeastar: No SNMP data from PBX'
              priority: HIGH
              description: 'No data received for {$YEASTAR.NODATA.TIMEOUT}. PBX down, SNMP disabled, credentials changed or path blocked.'
              tags:
                - tag: scope
                  value: availability
            - uuid: af7617ef01d84eb3abd34b485feb6832
