              recovery_expression: 'find(/Yeastar P-Series by SNMP/snmptrap["pPBXMaxCCTraps"],,"like","pPBXMaxCCTrapsRecovery")=1'
              name: 'Yeastar: PBX concurrent call limit reached (trap)'
              priority: HIGH
              manual_close: 'YES'
              tags:
