          delay: 1h
          history: 90d
          trends: '0'
          value_type: CHAR
          inventory_link: SERIALNO_A
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          tags:
            - tag: component
              value: system
          triggers:
            - uuid: fd5af68d3f754e719febcf64f327cc03
              expression: 'last(/Yeastar P-Series by SNMP/yeastar.serial,#1)<>last(/Yeastar P-Series by SNMP/yeastar.serial,#2) and length(last(/Yeastar P-Series by SNMP/yeastar.serial))>0'
              name: 'Yeastar: Serial number has changed (device replaced?)'
              opdata: 'Current: {ITEM.LASTVALUE1}'
              priority: INFO
              manual_close: 'YES'
              tags:
                - tag: scope
                  value: notice
        - uuid: 234387bdad3440ef85a0c1aeb1db03fc
          name: 'Yeastar: Uptime'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.22736.3.1.5.0
          key: yeastar.uptime
          delay: 5m
          history: 7d
          units: uptime
          description: 'pUptime is a string such as "18 days 00:18:26"; converted to seconds.'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var m = value.match(/(?:(\d+)\s*days?,?\s*)?(\d+):(\d+):(\d+)/);
                  if (!m) { throw 'Cannot parse uptime: ' + value; }
                  return (parseInt(m[1] || 0, 10) * 86400) + (parseInt(m[2], 10) * 3600) + (parseInt(m[3], 10) * 60) + parseInt(m[4], 10);
          tags:
            - tag: component
              value: system
          triggers:
            - uuid: 6bc64f37c5f5471db7458d23657b0354
              expression: 'last(/Yeastar P-Series by SNMP/yeastar.uptime)<10m'
              name: 'Yeastar: PBX has been restarted'
              opdata: 'Uptime: {ITEM.LASTVALUE1}'
              priority: WARNING
              manual_close: 'YES'
              tags:
                - tag: scope
                  value: availability
        - uuid: 997ce0a52c814031b46a8e24a0388348
          name: 'Yeastar: Local storage utilisation'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.22736.3.1.6.0
          key: yeastar.storage.util
          delay: 5m
          history: 30d
          value_type: FLOAT
          units: '%'
          preprocessing:
            - type: REGEX
              parameters:
