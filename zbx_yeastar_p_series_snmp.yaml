        # ---------------- SNMP traps ----------------
        - uuid: 110548dbdcd14591b97a361f8fe2fa80
          name: 'Yeastar: Trap - PBX max concurrent calls'
          type: SNMP_TRAP
          key: 'snmptrap["pPBXMaxCCTraps"]'
          delay: '0'
          history: 30d
          trends: '0'
          value_type: LOG
          logtimefmt: yyyyMMdd.hhmmss
          tags:
