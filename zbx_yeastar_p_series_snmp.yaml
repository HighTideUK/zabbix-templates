              name: 'Yeastar: Local storage critically full'
              opdata: 'Used: {ITEM.LASTVALUE1}'
              priority: HIGH
              tags:
                - tag: scope
                  value: capacity
            - uuid: 4186cdcc754345db80cc7e4f38c2e336
              expression: 'min(/Yeastar P-Series by SNMP/yeastar.storage.util,5m)>{$YEASTAR.STORAGE.UTIL.WARN}'
