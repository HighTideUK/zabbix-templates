zabbix_export:
  version: '6.0'
  date: '2026-09-29T00:00:00Z'
  groups:
    - uuid: 134e616fc71643a29ba504926749c4fd
      name: Templates/Telephony
  templates:
    - uuid: fc5bdeac87454581b0faf51c24f03c20
      template: 'Yeastar P-Series by SNMP'
      name: 'Yeastar P-Series by SNMP'
      description: |
        Yeastar P-Series PBX (Appliance / Software Edition) via SNMP, based on YEASTAR-P-SERIES-V1 MIB (enterprise 1.3.6.1.4.1.22736.3).
        Requires PBX firmware 37.18.0.18+ (Appliance) with SNMP enabled. Set SNMPv3 credentials on the host's SNMP interface (PBX supports MD5 auth / DES priv).
        Extension alerting is OFF by default: enable per extension with context macro {$YEASTAR.EXT.ALERT:"<ext>"}=1.
        Trunk alerting is ON by default: disable per trunk with {$YEASTAR.TRUNK.ALERT:"<trunk name>"}=0.
        Trap items need snmptrapd + Zabbix SNMP trapper configured on the server/proxy.
        Built by High Tide Group.
      groups:
        - name: Templates/Telephony
      items:
        # ---------------- System ----------------
        - uuid: c5df9538f78a47c5ac9216198fe50ed6
          name: 'Yeastar: Product model'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.22736.3.1.1.0
          key: yeastar.model
          delay: 1h
          history: 7d
          trends: '0'
          value_type: CHAR
          inventory_link: MODEL
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          tags:
            - tag: component
              value: system
        - uuid: 200213e2f01f45e89d887eb74c432283
          name: 'Yeastar: Hardware version'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.22736.3.1.2.0
          key: yeastar.hardware
          delay: 1h
          history: 7d
          trends: '0'
          value_type: CHAR
          inventory_link: HARDWARE
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          tags:
            - tag: component
              value: system
        - uuid: 8ffb3e28c8c3460e929684c20b792e3d
