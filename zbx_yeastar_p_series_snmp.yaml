          value_type: LOG
          logtimefmt: yyyyMMdd.hhmmss
          tags:
            - tag: component
              value: traps
          triggers:
            - uuid: 605d0cce52394bd2a62181411fe9a226
              expression: 'find(/Yeastar P-Series by SNMP/snmptrap["pTrunkMaxCCTraps"],,"regexp","pTrunkMaxCCTraps([^R]|$)")=1'
              recovery_mode: RECOVERY_EXPRESSION
              recovery_expression: 'find(/Yeastar P-Series by SNMP/snmptrap["pTrunkMaxCCTraps"],,"like","pTrunkMaxCCTrapsRecovery")=1'
              name: 'Yeastar: Trunk concurrent call limit reached (trap)'
              priority: AVERAGE
              manual_close: 'YES'
              tags:
                - tag: scope
                  value: capacity
        - uuid: 67b56f749b2247729adbf4ffa76c55e9
          name: 'Yeastar: Trap - Asterisk'
          type: SNMP_TRAP
          key: 'snmptrap["pAsteriskTraps"]'
          delay: '0'
          history: 30d
          trends: '0'
          value_type: LOG
          logtimefmt: yyyyMMdd.hhmmss
          tags:
            - tag: component
              value: traps
          triggers:
            - uuid: 515bf14c29304c8f9c7436fd84d0e56f
              expression: 'find(/Yeastar P-Series by SNMP/snmptrap["pAsteriskTraps"],,"regexp","pAsteriskTraps([^R]|$)")=1'
              recovery_mode: RECOVERY_EXPRESSION
              recovery_expression: 'find(/Yeastar P-Series by SNMP/snmptrap["pAsteriskTraps"],,"like","pAsteriskTrapsRecovery")=1'
              name: 'Yeastar: Asterisk abnormal status (trap)'
              priority: HIGH
